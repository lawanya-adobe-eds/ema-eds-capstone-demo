# Custom sitemap. The site-wide query index was split into per-section indices
# (see helix-query.yaml), so the sitemap is rebuilt here by aggregating all of
# them into a single /sitemap.xml. Each `source` is one published query index;
# they share the same `destination` so their URLs merge into one sitemap.
#
# This lists the 40 real content pages (home + section landings + all detail /
# sub-pages) and intentionally drops the block-library demo pages, /nav, and
# /footer that the previous auto-generated sitemap included.
sitemaps:
  default:
    destination: /sitemap.xml
    languages:
      pages:
        source: /us/en/pages-index.json
        destination: /sitemap.xml
        hreflang: en-US
      adventures:
        source: /us/en/adventures/query-index.json
        destination: /sitemap.xml
        hreflang: en-US
      magazine:
        source: /us/en/magazine/query-index.json
        destination: /sitemap.xml
        hreflang: en-US
      faqs:
        source: /us/en/faqs/faq-index.json
        destination: /sitemap.xml
        hreflang: en-US
      about:
        source: /us/en/about-us/people-index.json
        destination: /sitemap.xml
        hreflang: en-US
