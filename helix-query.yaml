version: 1

indices:
  # Full-site content index used by the header search live-suggest dropdown.
  default:
    include:
      - '/us/en/**'
    target: /us/en/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^"]*')
      category:
        # Adventure pages expose their category as the first spec pair
        # (label "Activity", value e.g. "Surfing"). The value is the second
        # cell of the first row of the specs block. Non-adventure pages have no
        # specs block, so this resolves to empty — which the listing blocks
        # simply ignore.
        select: main .specs > div:first-child > div:last-child
        value: |
          textContent(el)
      publishDate:
        # Magazine articles carry an editorial publish date as a `publish-date`
        # meta tag (ISO YYYY-MM-DD, authored in the page metadata). The dynamic
        # related-articles block formats it as "Weekday, D Mon YYYY" and sorts
        # newest-first. Pages without the meta resolve to empty.
        select: head > meta[name="publish-date"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers('last-modified'), 'ddd, DD MMM YYYY hh:mm:ss GMT')

  # Dedicated full-text index for the header search. The source (wknd.site)
  # searches the whole page body, so matching only title/description missed
  # in-body hits (e.g. "share" appears in each article's "Share this Story"
  # section). This index adds a `content` field (the main body text) so the
  # header live-suggest matches full text like the source. It is a SEPARATE
  # target so the default index the homepage/listing blocks fetch stays lean —
  # the body text only ships in this file, which the header fetches on demand
  # (first keystroke), never blocking render (protects Core Web Vitals).
  search:
    include:
      - '/us/en/**'
    target: /us/en/search-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      content:
        select: main
        value: |
          words(textContent(el), 0, 700)

  # FAQ index — one row per FAQ sub-page under /us/en/faqs/. The dynamic
  # accordion-faq block fetches this to build the FAQ list at runtime, so new
  # FAQ pages appear automatically without re-authoring the FAQs page. Each FAQ
  # sub-page renders the question as og:title and the full answer as its body
  # paragraph (so the answer text stays in the page HTML — searchable and
  # crawlable — unlike a client-only feed). `order` sequences the accordion.
  faq:
    include:
      - '/us/en/faqs/**'
    target: /us/en/faqs/faq-index.json
    properties:
      question:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      answer:
        # Full answer text is the first body paragraph of the FAQ sub-page.
        select: main > div > p
        value: |
          textContent(el)
      order:
        select: head > meta[name="order"]
        value: |
          attribute(el, 'content')

  # People index — one row per person sub-page under /us/en/about-us/. The
  # dynamic cards-people block fetches this to build the two About Us grids
  # ("Our Contributors" and "WKND Guides") at runtime, filtered by `group` and
  # ordered by `order`. Each person renders name/role/image as HTML on their own
  # sub-page, so the content stays searchable/crawlable (no SEO regression). The
  # portrait is captured from og:image (auto-imported + optimized onto our
  # domain), and the three social links from per-person meta tags.
  people:
    include:
      - '/us/en/about-us/**'
    target: /us/en/about-us/people-index.json
    properties:
      name:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      role:
        select: head > meta[name="role"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          attribute(el, 'content')
      group:
        select: head > meta[name="group"]
        value: |
          attribute(el, 'content')
      order:
        select: head > meta[name="order"]
        value: |
          attribute(el, 'content')
      facebook:
        select: head > meta[name="facebook"]
        value: |
          attribute(el, 'content')
      twitter:
        select: head > meta[name="twitter"]
        value: |
          attribute(el, 'content')
      instagram:
        select: head > meta[name="instagram"]
        value: |
          attribute(el, 'content')
