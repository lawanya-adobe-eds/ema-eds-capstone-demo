version: 1

indices:
  # Per-section content indices. The site-wide `default` index was split into
  # folder-scoped indices so each listing/dynamic block fetches only its own
  # section's rows (smaller, faster) and can be authored with an explicit index
  # path. The sitemap (helix-sitemap.yaml) aggregates these back together.

  # Adventure detail pages — feeds the adventures-listing grid + filter tabs and
  # the homepage "Where do you want to go?" (recent-adventures) grid.
  adventures:
    include:
      - '/us/en/adventures/**'
    target: /us/en/adventures/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^"]*')
      category:
        # Adventure pages expose their category as the first spec pair
        # (label "Activity", value e.g. "Surfing"). Drives the filter tabs.
        select: main .specs > div:first-child > div:last-child
        value: |
          textContent(el)
      lastModified:
        select: none
        value: |
          parseTimestamp(headers('last-modified'), 'ddd, DD MMM YYYY hh:mm:ss GMT')

  # Magazine article pages — feeds the magazine-listing grid, the homepage
  # "Recent Articles" (recent-articles) grid, and the article-sidebar
  # "Share this story" (related-articles) list.
  magazine:
    include:
      - '/us/en/magazine/**'
    target: /us/en/magazine/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^"]*')
      publishDate:
        # Editorial publish date (ISO YYYY-MM-DD) authored as a meta tag; the
        # related-articles block sorts newest-first on it.
        select: head > meta[name="publish-date"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers('last-modified'), 'ddd, DD MMM YYYY hh:mm:ss GMT')

  # Top-level pages (home + the section landing pages) — no other index covers
  # these, so this keeps them in the sitemap after the site-wide index removal.
  pages:
    include:
      - '/us/en'
      - '/us/en/adventures'
      - '/us/en/magazine'
      - '/us/en/faqs'
      - '/us/en/about-us'
    target: /us/en/pages-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers('last-modified'), 'ddd, DD MMM YYYY hh:mm:ss GMT')

  # Dedicated full-text index for the header search. The source (wknd.site)
  # searches the whole page body, so matching only title/description missed
  # in-body hits (e.g. "share" appears in each article's "Share this Story"
  # section). This index adds a `content` field (the main body text) so the
  # header live-suggest matches full text like the source. It is a SEPARATE
  # target so the section indices the blocks fetch stay lean — the body text
  # only ships in this file, which the header fetches on demand (first
  # keystroke), never blocking render (protects Core Web Vitals).
  search:
    include:
      - '/us/en/**'
    target: /us/en/search-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      content:
        select: main
        value: |
          words(textContent(el), 0, 700)

  # FAQ index — one row per FAQ sub-page under /us/en/faqs/. The dynamic
  # accordion-faq block fetches this to build the FAQ list at runtime, so new
  # FAQ pages appear automatically without re-authoring the FAQs page. Each FAQ
  # sub-page renders the question as og:title and the full answer as its body
  # paragraph (so the answer text stays in the page HTML — searchable and
  # crawlable — unlike a client-only feed). `order` sequences the accordion.
  faq:
    include:
      - '/us/en/faqs/**'
    target: /us/en/faqs/faq-index.json
    properties:
      question:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      answer:
        # Full answer text is the first body paragraph of the FAQ sub-page.
        select: main > div > p
        value: |
          textContent(el)
      order:
        select: head > meta[name="order"]
        value: |
          attribute(el, 'content')

  # People index — one row per person sub-page under /us/en/about-us/. The
  # dynamic cards-people block fetches this to build the two About Us grids
  # ("Our Contributors" and "WKND Guides") at runtime, filtered by `group` and
  # ordered by `order`. Each person renders name/role/image as HTML on their own
  # sub-page, so the content stays searchable/crawlable (no SEO regression). The
  # portrait is captured from og:image (auto-imported + optimized onto our
  # domain), and the three social links from per-person meta tags.
  people:
    include:
      - '/us/en/about-us/**'
    target: /us/en/about-us/people-index.json
    properties:
      name:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      role:
        select: head > meta[name="role"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          attribute(el, 'content')
      group:
        select: head > meta[name="group"]
        value: |
          attribute(el, 'content')
      order:
        select: head > meta[name="order"]
        value: |
          attribute(el, 'content')
      facebook:
        select: head > meta[name="facebook"]
        value: |
          attribute(el, 'content')
      twitter:
        select: head > meta[name="twitter"]
        value: |
          attribute(el, 'content')
      instagram:
        select: head > meta[name="instagram"]
        value: |
          attribute(el, 'content')
