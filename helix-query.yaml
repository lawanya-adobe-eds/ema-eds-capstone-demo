version: 1

indices:
  # Full-site content index used by the header search live-suggest dropdown.
  default:
    include:
      - '/us/en/**'
    target: /us/en/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          match(attribute(el, 'content'), 'https:\/\/[^"]*')
      category:
        # Adventure pages expose their category as the first spec pair
        # (label "Activity", value e.g. "Surfing"). The value is the second
        # cell of the first row of the specs block. Non-adventure pages have no
        # specs block, so this resolves to empty — which the listing blocks
        # simply ignore.
        select: main .specs > div:first-child > div:last-child
        value: |
          textContent(el)
      publishDate:
        # Magazine articles carry an editorial publish date as a `publish-date`
        # meta tag (ISO YYYY-MM-DD, authored in the page metadata). The dynamic
        # related-articles block formats it as "Weekday, D Mon YYYY" and sorts
        # newest-first. Pages without the meta resolve to empty.
        select: head > meta[name="publish-date"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers('last-modified'), 'ddd, DD MMM YYYY hh:mm:ss GMT')
